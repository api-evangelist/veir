aid: veir
name: VEIR
description: >-
  VEIR is a superconducting power delivery company founded in 2019 and headquartered in Woburn,
  Massachusetts. It builds low- and medium-voltage high-temperature superconducting (HTS)
  transmission systems that carry five to ten times more power than conventional conductors at the
  same voltage level, with roughly 90% less resistive line loss, targeted at AI data center
  campuses, energy producers, utilities and OEMs. Investors include Microsoft's Climate Innovation
  Fund, National Grid Partners, Breakthrough Energy Ventures, Congruent Ventures, The Engine
  Ventures, Galvanize Climate Solutions, Piva Capital, Tyche Partners and VXI Capital. VEIR is a
  hardware company and publishes no product API or developer program, but it does publish a
  deliberate agent-facing content layer on veir.com — a markdown twin of every indexed page, a
  semantic index at /sitemap.md, an RFC 9727 API catalog, OpenID Connect and RFC 9728 OAuth
  protected-resource discovery documents, and a Content-Signal AI usage preference in robots.txt.
