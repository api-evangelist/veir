apis:
- aid: veir:markdown
  name: VEIR Markdown Content Endpoint
  description: >-
    The single HTTP endpoint VEIR declares in its own RFC 9727 API catalog. It returns veir.com page
    content as text/markdown for agent consumption. Probed 2026-08-05: it returns HTTP 200 with
    content-type text/markdown but ignores query parameters — /api/markdown, /api/markdown?path=/about
    and /api/markdown?url=/about all returned the byte-identical homepage document. The per-page
    markdown twins indexed at /sitemap.md (append .md to a page path) are the working surface.
    This is a content endpoint, not a product API; VEIR publishes no OpenAPI describing it.
  humanURL: https://veir.com/sitemap.md
  baseURL: https://veir.com/api/
